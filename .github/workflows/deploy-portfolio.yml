name: Deploy Portfolio

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip npm build (use pre-built dist/bundle.js)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          role-session-name: deploy-portfolio-${{ github.run_id }}
          aws-region: us-east-1

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Resolve deployment targets from Terraform outputs
        id: tf-outputs
        working-directory: terraform
        run: |
          terraform init -input=false
          BUCKET=$(terraform output -raw portfolio_bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          CF_URL=$(terraform output -raw cloudfront_url)
          echo "bucket=${BUCKET}"       >> "$GITHUB_OUTPUT"
          echo "dist_id=${DIST_ID}"     >> "$GITHUB_OUTPUT"
          echo "cloudfront_url=${CF_URL}" >> "$GITHUB_OUTPUT"

      - name: Deploy portfolio
        env:
          PORTFOLIO_BUCKET_NAME: ${{ steps.tf-outputs.outputs.bucket }}
          CLOUDFRONT_DIST_ID: ${{ steps.tf-outputs.outputs.dist_id }}
        run: |
          ARGS=""
          [[ "${{ inputs.skip_build }}" == "true" ]] && ARGS="--skip-build"
          bash terraform/deploy.sh $ARGS

      - name: Output CloudFront URL
        run: |
          echo "### 🚀 Portfolio deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**CloudFront URL:** ${{ steps.tf-outputs.outputs.cloudfront_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Portfolio URL: ${{ steps.tf-outputs.outputs.cloudfront_url }}"
